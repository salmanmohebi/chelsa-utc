[project]
name = "chelsa-utc"
version = "1.0.0"
description = "CHELSA V2.1 daily recomputed on the 00-24 UTC day (numpy, SAGA-exact), with conversion to and from the original CHELSA GeoTIFF format"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "xarray>=2024.1",
    "zarr>=3.0.8",
    "numcodecs>=0.15",
    "rasterio>=1.3",
    "requests>=2.31",
]

[project.scripts]
chelsa-utc = "chelsa_utc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chelsa_utc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
